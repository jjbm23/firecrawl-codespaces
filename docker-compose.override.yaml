# Pre-built images — skips the 5-15 minute source build on first run.
# Copied into /workspaces/firecrawl/ by setup.sh.
# If these images aren't available, setup.sh falls back to building from source.
services:
  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    build: !reset null
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    build: !reset null

  rabbitmq:
    # On resume RabbitMQ can need more than the upstream 15-second retry window.
    healthcheck:
      start_period: 90s
